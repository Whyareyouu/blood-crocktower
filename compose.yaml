name: blood

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-blood}
      POSTGRES_USER: ${DB_USER:-blood}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Скопируйте .env.example в .env и задайте DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    image: blood-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/app/migrate"]
    environment: &api_environment
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-blood}
      DB_USER: ${DB_USER:-blood}
      DB_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD}
      DB_SSLMODE: disable
      API_PORT: "8080"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: blood-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api_environment
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
